# Tier 1 — rstsr-openblas conformance (driver/linalg bodies + shared core body
# via RSTSR_DEV dynamic linking). Runs on every PR and push to main.
# Tier assignments: rules/testing.md (tier matrix).
name: tier1-openblas

on:
  push:
    branches:
    - main
  pull_request:

# Compile and test on stable: this package targets stable Rust (MSRV in
# the facade manifest). RUSTUP_TOOLCHAIN outranks the repo's
# rust-toolchain.toml (nightly, for nightly-only rustfmt options).
# clippy.yml keeps the nightly toolchain for fmt/clippy.
env:
  RUSTUP_TOOLCHAIN: stable

jobs:
  unittests:
    # Pinned to noble: the resolute runner image installs the `amd64v3` OpenBLAS
    # (0.3.32+ds-5), whose zgeev returns wrong eigenvectors (calling zgeev_
    # directly on it gives 1e-1 residuals, against 1e-14 for the plain amd64
    # package of the same version).
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: openblas
    - uses: conda-incubator/setup-miniconda@v2
      with:
        miniconda-version: "latest"
    - name: install dependencies
      run: sudo apt-get install -y libopenblas-openmp-dev
    - name: conda environment setup
      run: |
        conda init; source $HOME/.bashrc; conda activate
        conda install -y numpy scipy
    - name: manifest initialization
      run: |
        conda init; source $HOME/.bashrc; conda activate
        cd rstsr-test-manifest/resources
        python gen_rand_vec.py
    - name: validate manifest (driver_validation_f64)
      run: |
        conda init; source $HOME/.bashrc; conda activate
        python rstsr-blas-traits/src/blas_tests_impl/driver_impl/driver_validation_f64.py
    - name: validate manifest (func_validation_f64)
      run: |
        conda init; source $HOME/.bashrc; conda activate
        python rstsr-blas-traits/src/blas_tests_impl/linalg_func/func_validation_f64.py
    - name: test
      # --test-threads=1: parallel test threads oversubscribe the CPU, since each test calls multi-threaded BLAS
      run: RSTSR_DEV=1 cargo test -p rstsr-openblas --release --features="openmp linalg" -- --test-threads=1

  # Default features of `rstsr-openblas` are `linalg` + `openmp`; this job runs
  # them against a pthread-built OpenBLAS, which takes the `OPENBLAS_THREAD`
  # runtime path (the OpenMP runtime is still linked, but unused by OpenBLAS).
  unittests-pthread:
    # see the runner-image note above
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: openblas-pthread
    - uses: conda-incubator/setup-miniconda@v2
      with:
        miniconda-version: "latest"
    - name: install dependencies
      run: sudo apt-get install -y libopenblas-pthread-dev
    - name: conda environment setup
      run: |
        conda init; source $HOME/.bashrc; conda activate
        conda install -y numpy scipy
    - name: manifest initialization
      run: |
        conda init; source $HOME/.bashrc; conda activate
        cd rstsr-test-manifest/resources
        python gen_rand_vec.py
    - name: validate manifest (driver_validation_f64)
      run: |
        conda init; source $HOME/.bashrc; conda activate
        python rstsr-blas-traits/src/blas_tests_impl/driver_impl/driver_validation_f64.py
    - name: validate manifest (func_validation_f64)
      run: |
        conda init; source $HOME/.bashrc; conda activate
        python rstsr-blas-traits/src/blas_tests_impl/linalg_func/func_validation_f64.py
    - name: test
      run: RSTSR_DEV=1 cargo test -p rstsr-openblas --release -- --test-threads=1
      env:
        # Ubuntu noble's libopenblas0-pthread (0.3.26) overflows libtest's default
        # 2 MiB test-thread stack in driver_impl LAPACK tests (pthread builds run
        # parallel LAPACK work on the calling thread's stack). Local 0.3.34 pthread
        # builds pass even with 512 KiB, so this is specific to the distro build.
        RUST_MIN_STACK: 16777216
